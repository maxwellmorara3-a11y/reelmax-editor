name: Build ReelMax APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Recreate Android Project with Fixed Kotlin
        run: |
          flutter create . --org com.reelmax.editor --project-name reelmax_editor --platforms=android
          # Fix Kotlin version to 1.9.22 - required by Flutter 3.22
          sed -i 's/org.jetbrains.kotlin.android" version ".*/org.jetbrains.kotlin.android" version "1.9.22" apply false/' android/settings.gradle
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/' android/build.gradle || true
      - run: flutter pub get
      - run: flutter build apk --release --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: ReelMax-APK
          path: build/app/outputs/flutter-apk/app-release.apk
