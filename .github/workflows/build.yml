name: Build ReelMax APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Fix - Pin flutter_tts to 4.0.2 + Kotlin 2.1.0 + SDKs
        run: |
          # 1. Pin flutter_tts to OLD version built with Kotlin 1.9 (compatible)
          sed -i 's/flutter_tts:.*/flutter_tts: 4.0.2/' pubspec.yaml
          cat pubspec.yaml | grep flutter_tts
          
          rm -rf android
          flutter create . --org com.reelmax.editor --project-name reelmax_editor --platforms=android
          
          # 2. settings.gradle Kotlin 2.1.0 + Gradle 8.7 (stable for Flutter 3.22)
          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  return properties.getProperty("flutter.sdk")
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories { gradlePluginPortal(); google(); mavenCentral() }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.3.0" apply false
              id "org.jetbrains.kotlin.android" version "2.1.0" apply false
          }
          include ":app"
          EOF
          sed -i 's/gradle-.*-all.zip/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # 3. SDKs
          echo "flutter.minSdkVersion=24" >> android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          echo "flutter.ndkVersion=25.1.8937393" >> android/local.properties
          
          # 4. CLEAN build.gradle - JAVA 17 + SDK 24/34 + FORCE kotlin-stdlib 2.1.0
          cat > android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) { flutterVersionCode = '1' }

          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) { flutterVersionName = '1.0' }

          android {
              namespace "com.reelmax.editor"
              compileSdk 34
              ndkVersion "25.1.8937393"

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }

              defaultConfig {
                  applicationId "com.reelmax.editor"
                  minSdk 24
                  targetSdk 34
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }

          // FORCE all Kotlin stdlib to 2.1.0 - fixes 2.2.20 conflict
          configurations.all {
              resolutionStrategy {
                  force "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
              }
          }

          flutter {
              source '../..'
          }
          EOF
          
          cat android/app/build.gradle
          
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: ReelMax-MIDNIGHT-ROMANCE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
