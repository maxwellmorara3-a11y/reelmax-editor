name: Build ReelMax APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Ultimate Fix - Hardcode SDK 24 + 36 + NDK
        run: |
          rm -rf android
          flutter create . --org com.reelmax.editor --project-name reelmax_editor --platforms=android
          # Fix 1: settings.gradle Kotlin 2.1.0
          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories { gradlePluginPortal(); google(); mavenCentral() }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.3.0" apply false
              id "org.jetbrains.kotlin.android" version "2.1.0" apply false
          }
          include ":app"
          EOF
          sed -i 's/gradle-.*-all.zip/gradle-8.4-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # Fix 2: FORCE local.properties
          echo "flutter.minSdkVersion=24" >> android/local.properties
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          echo "flutter.ndkVersion=25.1.8937393" >> android/local.properties
          
          # Fix 3: HARDCODE in app/build.gradle - OVERWRITE the lines that say flutter.minSdkVersion
          # This catches BOTH old and new Flutter formats
          sed -i 's/minSdkVersion.*/minSdkVersion 24/' android/app/build.gradle
          sed -i 's/minSdk .*/minSdk 24/' android/app/build.gradle
          sed -i 's/compileSdkVersion.*/compileSdkVersion 36/' android/app/build.gradle
          sed -i 's/compileSdk .*/compileSdk 36/' android/app/build.gradle
          sed -i 's/targetSdkVersion.*/targetSdkVersion 36/' android/app/build.gradle
          sed -i 's/targetSdk .*/targetSdk 36/' android/app/build.gradle
          sed -i 's/ndkVersion.*/ndkVersion "25.1.8937393"/' android/app/build.gradle
          sed -i 's/flutter.minSdkVersion/24/' android/app/build.gradle
          sed -i 's/flutter.compileSdkVersion/36/' android/app/build.gradle
          sed -i 's/flutter.targetSdkVersion/36/' android/app/build.gradle
          sed -i 's/flutter.ndkVersion/"25.1.8937393"/' android/app/build.gradle
          
          echo "=== FINAL CHECK ==="
          cat android/app/build.gradle
          echo "--- local.properties ---"
          cat android/local.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ReelMax-MIDNIGHT-ROMANCE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
