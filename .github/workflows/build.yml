name: Build ReelMax APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Ultimate Fix - All SDKs + JVM 17
        run: |
          rm -rf android
          flutter create . --org com.reelmax.editor --project-name reelmax_editor --platforms=android
          
          # 1. Fix settings.gradle Kotlin 2.1.0
          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  return properties.getProperty("flutter.sdk")
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories { gradlePluginPortal(); google(); mavenCentral() }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.3.0" apply false
              id "org.jetbrains.kotlin.android" version "2.1.0" apply false
          }
          include ":app"
          EOF
          
          sed -i 's/gradle-.*-all.zip/gradle-8.4-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # 2. Force SDK versions
          echo "flutter.minSdkVersion=24" >> android/local.properties
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          echo "flutter.ndkVersion=25.1.8937393" >> android/local.properties
          
          # 3. HARDCODE SDKs in build.gradle
          sed -i 's/flutter.minSdkVersion/24/' android/app/build.gradle
          sed -i 's/flutter.compileSdkVersion/36/' android/app/build.gradle
          sed -i 's/flutter.targetSdkVersion/36/' android/app/build.gradle
          sed -i 's/flutter.ndkVersion/"25.1.8937393"/' android/app/build.gradle
          sed -i 's/minSdkVersion.*/minSdkVersion 24/' android/app/build.gradle
          sed -i 's/minSdk .*/minSdk 24/' android/app/build.gradle
          sed -i 's/compileSdkVersion.*/compileSdkVersion 36/' android/app/build.gradle
          sed -i 's/compileSdk .*/compileSdk 36/' android/app/build.gradle
          sed -i 's/targetSdkVersion.*/targetSdkVersion 36/' android/app/build.gradle
          
          # 4. FIX JVM TARGET 1.8 vs 17 - THE FINAL FIX!
          # Inject Java 17 compatibility into build.gradle
          cat > /tmp/fix.py << 'PY'
          with open('android/app/build.gradle','r') as f: s=f.read()
          # Force Java 17
          if 'compileOptions' not in s:
              s=s.replace('android {', 'android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }')
          else:
              s=s.replace('JavaVersion.VERSION_1_8','JavaVersion.VERSION_17')
              s=s.replace('JavaVersion.VERSION_1.8','JavaVersion.VERSION_17')
              s=s.replace('"1.8"','"17"')
              if 'jvmTarget' not in s:
                  s=s.replace('compileOptions {', 'compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n    //OLD:')
              else:
                  s=s.replace('jvmTarget = "1.8"','jvmTarget = "17"')
                  s=s.replace("jvmTarget = '1.8'","jvmTarget = '17'")
          with open('android/app/build.gradle','w') as f: f.write(s)
          print(s)
          PY
          python3 /tmp/fix.py
          
          echo "=== FINAL BUILD.GRADLE ==="
          cat android/app/build.gradle
          
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ReelMax-MIDNIGHT-ROMANCE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
